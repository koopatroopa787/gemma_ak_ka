<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharos Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .critical {
            border-left: 5px solid #d0021b;
        }
        
        .critical .stat-value {
            color: #d0021b;
        }
        
        .high {
            border-left: 5px solid #f5a623;
        }
        
        .high .stat-value {
            color: #f5a623;
        }
        
        .moderate {
            border-left: 5px solid #ffd700;
        }
        
        .moderate .stat-value {
            color: #f5a623;
        }
        
        .low {
            border-left: 5px solid #1db85a;
        }
        
        .low .stat-value {
            color: #1db85a;
        }
        
        .total {
            border-left: 5px solid #2a5298;
        }
        
        .total .stat-value {
            color: #2a5298;
        }
        
        .chart-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }
        
        .chart-container h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        canvas {
            max-height: 400px;
        }
        
        .refresh-info {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
        }
        
        .last-update {
            color: rgba(255,255,255,0.7);
            margin-top: 10px;
        }
        
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 Pharos Dashboard</h1>
            <p>Real-time pharmaceutical package verification analytics</p>
        </header>
        
        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-label">Total Scans</div>
                <div class="stat-value" id="total">-</div>
            </div>
            <div class="stat-card critical">
                <div class="stat-label">Critical Risk</div>
                <div class="stat-value" id="critical">-</div>
            </div>
            <div class="stat-card high">
                <div class="stat-label">High Risk</div>
                <div class="stat-value" id="high">-</div>
            </div>
            <div class="stat-card moderate">
                <div class="stat-label">Moderate Risk</div>
                <div class="stat-value" id="moderate">-</div>
            </div>
            <div class="stat-card low">
                <div class="stat-label">Low Risk</div>
                <div class="stat-value" id="low">-</div>
            </div>
            <div class="stat-card total">
                <div class="stat-label">Last 24 Hours</div>
                <div class="stat-value" id="last24h">-</div>
            </div>
        </div>
        
        <div class="chart-container">
            <h2>Risk Distribution</h2>
            <canvas id="riskChart"></canvas>
        </div>
        
        <div class="refresh-info">
            <p>⟳ Dashboard updates automatically every 10 seconds</p>
            <div class="last-update">Last update: <span id="lastUpdate">-</span></div>
        </div>
    </div>
    
    <script>
        let riskChart = null;
        
        async function updateDashboard() {
            try {
                const response = await fetch('/api/v1/stats');
                const data = await response.json();
                
                // Update stat cards
                document.getElementById('total').textContent = data.total_scans;
                document.getElementById('critical').textContent = data.critical_count;
                document.getElementById('high').textContent = data.high_count;
                document.getElementById('moderate').textContent = data.moderate_count;
                document.getElementById('low').textContent = data.low_count;
                document.getElementById('last24h').textContent = data.last_24h_count;
                
                // Update chart
                updateChart(data);
                
                // Update timestamp
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Failed to fetch stats:', error);
            }
        }
        
        function updateChart(data) {
            const ctx = document.getElementById('riskChart').getContext('2d');
            
            if (riskChart) {
                riskChart.data.datasets[0].data = [
                    data.critical_count,
                    data.high_count,
                    data.moderate_count,
                    data.low_count
                ];
                riskChart.update();
            } else {
                riskChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Critical', 'High', 'Moderate', 'Low'],
                        datasets: [{
                            data: [
                                data.critical_count,
                                data.high_count,
                                data.moderate_count,
                                data.low_count
                            ],
                            backgroundColor: [
                                '#d0021b',
                                '#f5a623',
                                '#ffd700',
                                '#1db85a'
                            ],
                            borderColor: 'white',
                            borderWidth: 2,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                position: 'right',
                            }
                        }
                    }
                });
            }
        }
        
        // Initial load
        updateDashboard();
        
        // Update every 10 seconds
        setInterval(updateDashboard, 10000);
    </script>
</body>
</html>
